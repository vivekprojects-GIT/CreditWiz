[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
# Never resolve the Microsoft Store python.exe alias: uv cannot query it and
# fails with a misleading "No module named 'python'". Use uv-managed CPython.
python-preference = "only-managed"
